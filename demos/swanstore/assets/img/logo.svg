<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Swan Store">
  <title>Swan Store</title>
  <!-- Hand-drawn "rocky swan": long S-neck, plump body, lifted tail, with a
       lightning bolt for the rock side of the shop. Deliberately few strokes
       so it still reads at 42px in the header. Stroke-only with round caps
       and slightly uneven curves so it looks inked rather than geometric,
       and `currentColor` throughout so it takes the colour of whatever sits
       around it instead of carrying its own background like the old raster
       logo did. -->
  <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- head -->
    <path d="M22.6 8.2c3-.9 5.5 1.3 4.9 3.9-.5 2.1-2.8 3-4.7 2.4" />
    <!-- beak -->
    <path d="M22.2 10.1 16.3 11.6l5.7 2" />
    <!-- long S-neck into the breast -->
    <path d="M23.4 14.8c2.2 4.6 1.1 8.6 3.3 12.6 1.2 2.2 2.8 3.9 4.6 5.2" />
    <!-- body: one closed teardrop, breast round and tail lifted -->
    <path d="M31.3 32.6c-9.6-.3-15.6 5.6-12.1 10.9 3.6 5.3 15.2 6.2 23.1 2.2 5.3-2.7 8.6-6.6 9.1-10.2-4.9-2-13.1-3-20.1-2.9Z" />
    <!-- tail flick off the back -->
    <path d="M51.4 35.5c2.6-1.2 4.6-3 5.8-5.2-2.4.4-4.4.3-5.9-.2" />
    <!-- rock: the wing marking IS a lightning bolt. Drawn on its own rather
         than layered over a wing arc — at 42px the two together just read as
         a squiggle. -->
    <path d="M38.6 34.9 32.6 41.4h4.1l-3.4 5.6" />
    <!-- eye -->
    <path d="M24.2 10.9h.02" stroke-width="3" />
    <!-- water -->
    <path d="M11.2 53.8c3.2-2 6 1.5 9.2-.4" stroke-width="1.9" />
    <path d="M25.8 56.2c4-2.1 7.4 1.7 11.4-.4" stroke-width="1.9" />
    <path d="M42.6 53.9c3-1.9 5.6 1.4 8.6-.3" stroke-width="1.9" />
  </g>
</svg>
